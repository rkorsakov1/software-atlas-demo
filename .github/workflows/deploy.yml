name: Deploy to GitHub Pages

# Builds the static site and publishes it to the gh-pages branch, which GitHub
# Pages serves at https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild runs validate-data and typecheck.
      - run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      # Without this, Pages' Jekyll step drops the _next/ folder.
      - run: touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
